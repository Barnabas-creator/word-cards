<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF3FA">
<title>英语单词卡</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="老婆加油">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#EDF3FA; --surface:#FFFFFF; --surface-2:#DEE9F5;
  --ink:#17293C; --ink-2:#4C6580; --ink-3:#8098B0; --line:#CBDCEC;
  --accent:#3D7BB0; --accent-soft:#DCEAF7;
  --real:#3D7BB0; --fake:#B06A72; --warn:#B99154; --ok:#4F8A6B;
  --shadow:0 1px 2px rgba(23,41,60,.05), 0 10px 26px -14px rgba(23,41,60,.28);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101922; --surface:#18242F; --surface-2:#22313F;
    --ink:#DEE9F3; --ink-2:#9DB4C8; --ink-3:#6F8599; --line:#2C3D4D;
    --accent:#8FBEE4; --accent-soft:#1B3242;
    --real:#8FBEE4; --fake:#DBA0A6; --warn:#D4B27C; --ok:#8BC5A3;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#101922; --surface:#18242F; --surface-2:#22313F;
  --ink:#DEE9F3; --ink-2:#9DB4C8; --ink-3:#6F8599; --line:#2C3D4D;
  --accent:#8FBEE4; --accent-soft:#1B3242;
  --real:#8FBEE4; --fake:#DBA0A6; --warn:#D4B27C; --ok:#8BC5A3;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Source Sans 3","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%}
[hidden]{display:none!important}
/* 下拉刷新：安卓 Chrome 自带的下拉刷新关掉，统一用自己的，iOS 独立 App 模式本来就没有 */
html,body{overscroll-behavior-y:contain}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:50;
  transform:translate(-50%,-60px);transition:transform .2s ease,opacity .2s ease;opacity:0;pointer-events:none;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:99px;
  padding:6px 14px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.ptr.dragging{transition:none}
.wrap{width:100%;max-width:460px;margin:0 auto;padding-inline:16px;padding-block:16px 28px;
  display:flex;flex-direction:column;gap:14px;min-height:100%}

.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.masthead h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:20px;margin:0}
.today{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.today b{color:var(--ink-2);font-weight:600}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface-2);border-radius:11px;padding:4px}
.tabs button{font:inherit;font-weight:600;font-size:12px;border:0;border-radius:8px;padding:8px 2px;
  cursor:pointer;background:transparent;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.meter{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3)}
.meter .bar{flex:1;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}
.meter .count{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 18px;display:flex;flex-direction:column;gap:13px;
  min-height:330px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}
.chip.lvl{background:var(--accent-soft);color:var(--accent)}
.chip.box{background:transparent;border:1px solid var(--line);color:var(--ink-3)}
.headword{font-family:"Newsreader",Georgia,serif;font-size:36px;font-weight:500;line-height:1.1;
  margin:0;text-wrap:balance;letter-spacing:-.01em;word-break:break-word}
.ipa{font-family:"Newsreader",Georgia,serif;font-style:italic;color:var(--ink-2);font-size:17px}
.pos{color:var(--ink-3);font-size:13px}
.hint{margin-top:auto;font-size:12px;color:var(--ink-3)}
.back{display:none;flex-direction:column;gap:13px}
.card.flipped .front{display:none}
.card.flipped .back{display:flex}
.gloss{font-size:19px;font-weight:600}
.row{border-top:1px solid var(--line);padding-top:10px}
.rowlabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.fam{display:flex;flex-wrap:wrap;gap:6px}
.fam span{font-family:"Newsreader",Georgia,serif;font-size:15px;background:var(--surface-2);border-radius:6px;padding:2px 8px;
  display:inline-flex;flex-direction:column;line-height:1.3}
.fam span small{font-family:"Source Sans 3","PingFang SC",system-ui,sans-serif;font-size:11.5px;color:var(--ink-3)}
.ex{font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.5}
.ex b{font-weight:600;color:var(--accent);font-style:normal}
.exzh{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.conf{display:flex;flex-wrap:wrap;gap:8px;font-family:"Newsreader",Georgia,serif;font-size:15px;color:var(--ink-2)}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:10px;padding:12px 10px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0E1C27}
.btn.wide{grid-column:1 / -1}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
  padding:28px 18px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px}
.empty .big{font-family:"Newsreader",Georgia,serif;font-size:26px;color:var(--ink)}

.timerbar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timerbar i{display:block;height:100%;background:var(--warn);width:100%}
.probe{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:22px 16px;text-align:center}
.probe .word{font-family:"Newsreader",Georgia,serif;font-size:32px;font-weight:500;word-break:break-word}
.probe .verdict{font-size:13px;font-weight:600;min-height:20px}
.verdict.ok{color:var(--ok)}
.verdict.no{color:var(--fake)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.judge .btn{padding:15px 10px;font-size:15px}
.judge .fakebtn{border-color:var(--fake);color:var(--fake)}
.judge .realbtn{border-color:var(--real);color:var(--real)}
.tally{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px;display:flex;flex-direction:column;gap:12px}
.score{font-family:"Newsreader",Georgia,serif;font-size:32px;font-weight:600}
.score small{font-size:14px;color:var(--ink-3);font-weight:400;font-family:"Source Sans 3",sans-serif}
.breakdown{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-size:12.5px}
.brow .track{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.brow .track i{display:block;height:100%;background:var(--fake)}
.brow .n{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.misses{font-size:13px;color:var(--ink-2);line-height:1.8}
.misses b{font-family:"Newsreader",Georgia,serif;font-weight:500;color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
.tile .n{font-family:"Newsreader",Georgia,serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;color:var(--ink-3)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-top:1px solid var(--line);padding-top:12px;font-size:13.5px}
.setting input[type=number]{font:inherit;width:74px;padding:7px 9px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--ink);text-align:right}
.setting select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink)}
.danger{color:var(--fake);background:none;border:0;font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.spk{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--accent);
  border-radius:99px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;flex:none;-webkit-tap-highlight-color:transparent}
.spk:active{background:var(--accent-soft)}
.spk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spk svg{width:17px;height:17px;fill:currentColor}
.spk.big{width:42px;height:42px}
.spk.big svg{width:20px;height:20px}
.ipa-row{display:flex;align-items:center;gap:10px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.search{display:flex;gap:8px}
.qwrap{position:relative;flex:1;display:flex}
.qwrap input{width:100%;padding-right:40px}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border:0;border-radius:99px;background:var(--surface-2);color:var(--ink-2);
  font:inherit;font-size:16px;line-height:1;cursor:pointer;display:none;
  align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
.qclear.on{display:flex}
.qclear:active{background:var(--line)}
.qclear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search input{flex:1;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.entry .hw{font-family:"Newsreader",Georgia,serif;font-size:32px;font-weight:500;line-height:1.1}
.entry .core{font-size:17px;font-weight:600}
.pair{font-size:14px;line-height:1.5}
.pair .t{font-family:"Newsreader",Georgia,serif}
.pair .zh{color:var(--ink-2);font-size:13px}
.der{border-top:1px solid var(--line);padding-top:10px}
.der .dw{font-family:"Newsreader",Georgia,serif;font-size:17px;font-weight:500}
.der .dipa{font-family:"Newsreader",Georgia,serif;font-style:italic;color:var(--ink-3);font-size:14px}
.src-badge{font-size:11px;color:var(--ink-3)}
.cal-day{border-top:1px solid var(--line);padding:11px 0}
.cal-date{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px;
  font-variant-numeric:tabular-nums}
.cal-words{display:flex;flex-wrap:wrap;gap:6px}
.cal-w{font-family:"Newsreader",Georgia,serif;font-size:14.5px;padding:3px 9px;border-radius:99px;
  border:1px solid var(--accent);color:var(--accent);cursor:pointer;background:transparent}
.cal-w.ai{background:var(--accent);color:#fff}
:root[data-theme="dark"] .cal-w.ai,:root:not([data-theme="light"]) .cal-w.ai{color:#0E1C27}
.cal-stat{font-size:12px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="ptr" id="ptr" aria-live="polite">下拉刷新</div>
<div class="wrap">
  <div class="masthead">
    <h1>英语单词卡</h1>
    <div class="today" id="today">加载中…</div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-dict" aria-selected="true">查词</button>
    <button role="tab" id="tab-cal" aria-selected="false">日历</button>
    <button role="tab" id="tab-deck" aria-selected="false">复习</button>
    <button role="tab" id="tab-drill" aria-selected="false">真假词</button>
    <button role="tab" id="tab-more" aria-selected="false">进度</button>
  </div>

  <!-- ============ 查词 ============ -->
  <section id="panel-dict">
    <div class="search">
      <div class="qwrap">
        <input id="q" type="text" placeholder="输入一个英语单词" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button class="qclear" id="qclear" type="button" aria-label="清空" title="清空">✕</button>
      </div>
      <button class="btn primary" id="qbtn">查</button>
    </div>
    <div id="dict-msg" class="note" style="border:0;padding-top:10px"></div>
    <div id="dict-out"></div>
  </section>

  <!-- ============ 日历 ============ -->
  <section id="panel-cal" hidden>
    <div class="note" style="border:0;padding-top:0">
      实心 = 当时真的调了 AI，描边 = 直接读的本地词库。点词可以再看一次。
    </div>
    <div id="cal-out"></div>
  </section>

  <!-- ============ 今日复习 ============ -->
  <section id="panel-deck" hidden>
    <div class="meter">
      <span>今日</span>
      <span class="bar"><i id="deckbar"></i></span>
      <span class="count" id="deckcount">—</span>
    </div>

    <div class="card" id="card" tabindex="0" role="button" aria-label="点击翻面" hidden>
      <div class="front">
        <div class="chips" id="f-chips"></div>
        <h2 class="headword" id="f-word"></h2>
        <div class="ipa-row">
          <span class="ipa" id="f-ipa"></span>
          <button class="spk big" id="f-spk" title="朗读"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4.5v15a1 1 0 0 1-1.7.7L6.6 15.5H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h2.6l4.7-4.7a1 1 0 0 1 1.7.7Z"/><path d="M16.5 8.3a1 1 0 0 1 1.4 0 5.2 5.2 0 0 1 0 7.4 1 1 0 0 1-1.4-1.4 3.2 3.2 0 0 0 0-4.6 1 1 0 0 1 0-1.4Z"/><path d="M18.8 5.6a1 1 0 0 1 1.4 0 9 9 0 0 1 0 12.8 1 1 0 0 1-1.4-1.4 7 7 0 0 0 0-10 1 1 0 0 1 0-1.4Z"/></svg></button>
        </div>
        <div class="pos" id="f-pos"></div>
        <div class="hint">点一下翻面</div>
      </div>
      <div class="back">
        <div class="chips" id="b-chips"></div>
        <h2 class="headword" id="b-word" style="font-size:26px"></h2>
        <div class="gloss" id="b-zh"></div>
        <div class="row" id="b-famrow">
          <div class="rowlabel">词族</div>
          <div class="fam" id="b-fam"></div>
        </div>
        <div class="row">
          <div class="ex-head">
            <div class="rowlabel" style="margin:0">例句</div>
            <button class="spk" id="b-spk" title="朗读例句"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4.5v15a1 1 0 0 1-1.7.7L6.6 15.5H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h2.6l4.7-4.7a1 1 0 0 1 1.7.7Z"/><path d="M16.5 8.3a1 1 0 0 1 1.4 0 5.2 5.2 0 0 1 0 7.4 1 1 0 0 1-1.4-1.4 3.2 3.2 0 0 0 0-4.6 1 1 0 0 1 0-1.4Z"/><path d="M18.8 5.6a1 1 0 0 1 1.4 0 9 9 0 0 1 0 12.8 1 1 0 0 1-1.4-1.4 7 7 0 0 0 0-10 1 1 0 0 1 0-1.4Z"/></svg></button>
          </div>
          <div class="ex" id="b-ex" style="margin-top:5px"></div>
          <div class="exzh" id="b-exzh"></div>
        </div>
        <div class="row" id="b-confrow">
          <div class="rowlabel">易混</div>
          <div class="conf" id="b-conf"></div>
        </div>
      </div>
    </div>

    <div class="empty" id="deck-empty" hidden>
      <div class="big" id="empty-big">今日已完成</div>
      <div id="empty-sub"></div>
      <button class="btn" id="study-more" hidden>再多背 20 个新词</button>
    </div>

    <div class="controls" id="deck-controls" style="margin-top:12px" hidden>
      <button class="btn" id="again">忘了</button>
      <button class="btn primary" id="known">记住了</button>
    </div>
  </section>

  <!-- ============ 真假词 ============ -->
  <section id="panel-drill" hidden>
    <div id="drill-live">
      <div class="timerbar"><i id="timer"></i></div>
      <div class="probe" style="margin-top:14px">
        <div class="word" id="probe-word">—</div>
        <div class="verdict" id="verdict"></div>
      </div>
      <div class="judge" style="margin-top:14px">
        <button class="btn fakebtn" id="btn-fake">假词</button>
        <button class="btn realbtn" id="btn-real">真词</button>
      </div>
      <div class="tally" style="margin-top:10px">
        <span id="tally-pos">—</span>
        <span id="tally-acc">正确率 —</span>
      </div>
    </div>

    <div class="report" id="drill-report" hidden>
      <div>
        <div class="score" id="r-acc">—<small> 正确率</small></div>
        <div style="font-size:12.5px;color:var(--ink-3)" id="r-time"></div>
      </div>
      <div>
        <div class="rowlabel">错因分布</div>
        <div class="breakdown" id="r-breakdown"></div>
      </div>
      <div>
        <div class="rowlabel">错的词</div>
        <div class="misses" id="r-misses"></div>
      </div>
      <button class="btn primary" id="again-drill">再来一轮</button>
    </div>
  </section>

  <!-- ============ 进度 ============ -->
  <section id="panel-more" hidden>
    <div class="stats">
      <div class="tile"><div class="n" id="s-new">—</div><div class="l">没学过</div></div>
      <div class="tile"><div class="n" id="s-learning">—</div><div class="l">复习中</div></div>
      <div class="tile"><div class="n" id="s-done">—</div><div class="l">已掌握</div></div>
    </div>
    <div class="stats" style="margin-top:8px">
      <div class="tile"><div class="n" id="s-b1">—</div><div class="l">盒1 每天</div></div>
      <div class="tile"><div class="n" id="s-b2">—</div><div class="l">盒2 隔天</div></div>
      <div class="tile"><div class="n" id="s-b3">—</div><div class="l">盒3 四天</div></div>
    </div>

    <div class="setting"><span>每天新词</span><input type="number" id="set-daily" min="5" max="200" step="5"></div>
    <div class="setting"><span>学习范围</span>
      <select id="set-lvl"><option value="all">全部等级</option></select>
    </div>
    <div class="setting"><span>发音</span>
      <select id="set-accent">
        <option value="en-us">美音</option>
        <option value="en-gb">英音</option>
        <option value="off">关闭</option>
      </select>
    </div>
    <div class="setting"><span>翻面自动朗读</span>
      <select id="set-auto">
        <option value="1">开</option>
        <option value="0">关</option>
      </select>
    </div>
    <div class="setting"><span>速判限时</span>
      <select id="set-limit">
        <option value="3000">3 秒</option>
        <option value="5000">5 秒</option>
        <option value="8000">8 秒</option>
        <option value="0">不限时</option>
      </select>
    </div>
    <div class="setting" style="flex-direction:column;align-items:stretch;gap:7px">
      <span>Gemini API 密钥（只有查词需要）</span>
      <input type="password" id="set-key" placeholder="AIza… 或 AQ.…" autocomplete="off"
        style="font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%">
      <span style="font-size:11.5px;color:var(--ink-3)">
        在 aistudio.google.com/apikey 免费申请，不用绑卡。只存在这台设备上，不会上传。
      </span>
    </div>
    <div class="setting"><span>跨设备同步</span><span id="sync-state" style="font-size:12px;color:var(--ink-3)">—</span></div>
    <div class="setting"><span>清空学习进度</span><button class="danger" id="reset">清空</button></div>

    <p class="note" id="libnote"></p>
  </section>
</div>

<script>
/* ===================== 存储 ===================== */
const LS_PROGRESS = "wc.progress.v1";
const LS_SETTINGS = "wc.settings.v1";
const DAY = 86400000;
const BOX_DAYS = { 1: 1, 2: 2, 3: 4 };

function lsGet(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lsSet(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

let progress = lsGet(LS_PROGRESS, {});           // { word: { box:1|2|3, due:ms, seen:n } }
let settings = Object.assign({ daily: 50, lvl: "all", limit: 5000, key: "", accent: "en-us", autoSpeak: 1 }, lsGet(LS_SETTINGS, {}));
const saveProgress = () => lsSet(LS_PROGRESS, progress);
const saveSettings = () => lsSet(LS_SETTINGS, settings);

/* ===================== 数据 ===================== */
let CARDS = [], FAKES = [], LEVELS = [], FAMGLOSS = {};
const $ = (id) => document.getElementById(id);

async function loadData(){
  const manifest = await (await fetch("data/manifest.json", { cache: "no-cache" })).json();
  const groups = await Promise.all(
    manifest.shards.map((s) => fetch("data/" + s.file).then((r) => r.json()))
  );
  CARDS = groups.flat();
  for (const c of lsGet(LS_EXTRA, [])) if (!CARDS.some((x) => x.w.toLowerCase() === c.w.toLowerCase())) CARDS.push(c);
  LEVELS = [...new Set(CARDS.map((c) => c.lvl))];
  FAKES = await (await fetch("data/fakewords.json")).json();
  // 词族释义表缺了也不影响背卡，查词页的词族只是少了中文
  FAMGLOSS = await fetch("data/famgloss.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
}

/* ===================== Leitner ===================== */
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const inScope = (c) => settings.lvl === "all" || c.lvl === settings.lvl;

function state(w){ return progress[w] ?? null; }
function dueCards(){
  const now = Date.now();
  return CARDS.filter((c) => inScope(c) && state(c.w) && state(c.w).box < 4 && state(c.w).due <= now);
}
function newCards(){
  const fresh = CARDS.filter((c) => inScope(c) && !state(c.w));
  // 自己查过的生词排最前：那是她真正遇到、想记住的词，不该排在几百张卡之后
  return [...fresh.filter((c) => c.src === "查词"), ...fresh.filter((c) => c.src !== "查词")];
}
function masteredCount(){ return CARDS.filter((c) => inScope(c) && state(c.w)?.box >= 4).length; }
function learningCount(){ return CARDS.filter((c) => inScope(c) && state(c.w) && state(c.w).box < 4).length; }
function boxCount(b){ return CARDS.filter((c) => inScope(c) && state(c.w)?.box === b).length; }

let queue = [];
let extraNew = 0;

function buildQueue(){
  const due = dueCards();
  const fresh = newCards().slice(0, Math.max(0, settings.daily + extraNew - countStartedToday()));
  queue = [...due, ...fresh];
  return queue;
}
function countStartedToday(){
  const t = today();
  return Object.values(progress).filter((p) => p.started >= t).length;
}

function grade(word, remembered){
  const p = progress[word] ?? { box: 1, seen: 0, started: Date.now() };
  p.seen = (p.seen ?? 0) + 1;
  if (remembered){
    p.box = Math.min(4, (p.box ?? 1) + 1);   // 4 = 已掌握，不再出现
  } else {
    p.box = 1;
  }
  p.due = p.box >= 4 ? Infinity : Date.now() + BOX_DAYS[p.box] * DAY;
  if (p.due === Infinity) p.due = 8.64e15;
  p.at = Date.now();                       // 合并时按这个取较新的一条
  progress[word] = p;
  saveProgress();
  scheduleSync();
}

/* ===================== 发音 =====================
   移植自印尼语版 lib/tts.js。英语音色各平台基本都自带，但另外两个坑照样存在：
   1. getVoices() 首次同步调用返回空数组，音色要等 voiceschanged 才到齐；
      早于它 speak()，Chrome 往往直接静音（只设 lang 不够）。
   2. Chrome 老问题：cancel() 之后立刻 speak()，这条会被丢掉。换卡片时正好踩中。
   3. iOS Safari 要求首次 speak() 落在用户手势的同步调用栈里——所以「音色已就绪
      且当前没在播」这条最常见的路径必须同步直发，不能一律 setTimeout。 */
const CANCEL_GAP_MS = 120;
const VOICES_TIMEOUT_MS = 2000;
const synth = window.speechSynthesis;

function pickVoice(voices, want){
  const list = voices ?? [];
  const norm = (l) => String(l ?? "").replace("_", "-").toLowerCase();
  const exact = list.filter((v) => norm(v.lang) === want);
  // 优先挑本地音色：网络音色在断网时不发声
  return exact.find((v) => v.localService) ?? exact[0]
      ?? list.find((v) => norm(v.lang).split("-")[0] === "en") ?? null;
}

const tts = (() => {
  if (!synth) return { speak(){}, stop(){}, available: false };
  const voicesLoaded = () => (synth.getVoices() ?? []).length > 0;
  const voice = () => pickVoice(synth.getVoices(), settings.accent || "en-us");

  let readyPromise = null;
  function whenReady(){
    if (readyPromise) return readyPromise;
    if (voicesLoaded()) return (readyPromise = Promise.resolve());
    readyPromise = new Promise((resolve) => {
      let done = false;
      const finish = () => { if (!done){ done = true; resolve(); } };
      synth.addEventListener?.("voiceschanged", finish, { once: true });
      setTimeout(finish, VOICES_TIMEOUT_MS);
    });
    return readyPromise;
  }

  function utter(text, rate){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (settings.accent || "en-us").toUpperCase().replace("EN-", "en-");
    u.rate = rate;
    const v = voice();
    // 挂音色失败不能连累整句朗读：只设 lang 让系统尽力读，总比一声不出强
    try { if (v) u.voice = v; } catch {}
    return u;
  }
  function push(u){ synth.resume?.(); synth.speak(u); }

  let epoch = 0;
  const busy = () => Boolean(synth.speaking || synth.pending);

  function run(start){
    const mine = ++epoch;
    const needsCancel = busy();
    if (needsCancel) synth.cancel();
    const go = () => { if (mine === epoch) start(); };
    if (!needsCancel && voicesLoaded()) return go();   // 同步直发，保住 iOS 的用户手势
    whenReady().then(() => setTimeout(go, needsCancel ? CANCEL_GAP_MS : 0));
    return undefined;
  }

  return {
    available: true,
    speak(text, { rate = 0.95 } = {}){
      if (!text || settings.accent === "off") return;
      run(() => push(utter(text, rate)));
    },
    // 单词读完停一下再读例句，比连着读清楚
    speakPair(word, sentence){
      if (settings.accent === "off") return;
      run(() => {
        const mine = epoch;
        const a = utter(word, 0.85);
        a.onend = () => setTimeout(() => {
          if (mine === epoch && sentence) push(utter(sentence, 0.95));
        }, 350);
        push(a);
      });
    },
    stop(){ epoch += 1; synth.cancel(); },
  };
})();

/* ===================== 卡片界面 ===================== */
let idx = 0;

function chipHtml(c){
  const st = state(c.w);
  const boxChip = st ? `<span class="chip box">盒${Math.min(st.box,3)}</span>` : `<span class="chip box">新词</span>`;
  return `<span class="chip lvl">${c.lvl}</span><span class="chip">${c.src}</span>` +
         `<span class="chip">${(c.c || []).join("/")}</span>` + boxChip;
}
function markEx(c){
  const stem = c.w.length > 4 ? c.w.slice(0, c.w.length - 2) : c.w;
  try {
    return c.ex.replace(new RegExp(`\\b(${stem}\\w*)`, "i"), "<b>$1</b>");
  } catch { return c.ex; }
}
function renderCard(){
  const q = queue;
  $("deckcount").textContent = `${Math.max(0, q.length)} 待背`;
  const total = Math.max(1, q.length + countStartedToday());
  $("deckbar").style.width = `${(countStartedToday() / total) * 100}%`;

  if (!q.length){
    $("card").hidden = true;
    $("deck-controls").hidden = true;
    $("deck-empty").hidden = false;
    const left = newCards().length;
    $("empty-sub").textContent = left
      ? `这个范围里还有 ${left} 个新词没学。`
      : `这个范围里的词都学过了。`;
    $("study-more").hidden = !left;
    return;
  }
  $("deck-empty").hidden = true;
  $("card").hidden = false;
  $("deck-controls").hidden = false;

  if (idx >= q.length) idx = 0;
  const c = q[idx];
  $("f-chips").innerHTML = chipHtml(c);
  $("b-chips").innerHTML = chipHtml(c);
  $("f-word").textContent = c.w;
  $("b-word").textContent = c.w;
  $("f-ipa").textContent = c.ipa;
  $("f-pos").textContent = c.pos;
  $("b-zh").textContent = c.zh;
  $("b-famrow").hidden = !(c.fam && c.fam.length);
  // 词族下面带一行小字中文，只取第一个义项，免得小标签撑太宽
  $("b-fam").innerHTML = (c.fam || []).map((f) => {
    const zh = famInfo(f).zh.replace(/^[（(][^）)]*[）)]\s*/, "").split(/[、，,；;]/)[0].trim();   // 去掉「（名）」这类词性前缀
    return `<span>${f}${zh ? `<small>${zh}</small>` : ""}</span>`;
  }).join("");
  $("b-ex").innerHTML = markEx(c);
  $("b-exzh").textContent = c.exZh;
  $("b-confrow").hidden = !(c.conf && c.conf.length);
  $("b-conf").innerHTML = (c.conf || []).map((x) => `<span>${x}</span>`).join("");
  $("card").classList.remove("flipped");
  tts.stop();
  updateToday();
}
function answerCard(remembered){
  const c = queue[idx];
  if (!c) return;
  if (!progress[c.w]) progress[c.w] = { box: 1, seen: 0, started: Date.now() };
  grade(c.w, remembered);
  logDay("card");
  queue.splice(idx, 1);
  if (!remembered) queue.push(c);          // 忘了的排到队尾，本轮再见一次
  renderCard();
}

$("card").addEventListener("click", (e) => {
  if (e.target.closest(".spk")) return;          // 点喇叭只朗读，不翻面
  $("card").classList.toggle("flipped");
  if (settings.autoSpeak && $("card").classList.contains("flipped")){
    const c = queue[idx];
    if (c) tts.speakPair(c.w, c.ex);             // 翻到背面时读单词 + 例句
  }
});
$("f-spk").addEventListener("click", (e) => { e.stopPropagation(); const c = queue[idx]; if (c) tts.speak(c.w, { rate: 0.85 }); });
$("b-spk").addEventListener("click", (e) => { e.stopPropagation(); const c = queue[idx]; if (c) tts.speak(c.ex); });
$("card").addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter"){ e.preventDefault(); $("card").classList.toggle("flipped"); }
});
$("known").addEventListener("click", () => answerCard(true));
$("again").addEventListener("click", () => answerCard(false));
$("study-more").addEventListener("click", () => { extraNew += 20; buildQueue(); renderCard(); });

function updateToday(){
  const done = countStartedToday();
  $("today").innerHTML = `今日 <b>${done}</b> / ${settings.daily} 新词<br>已掌握 <b>${masteredCount()}</b> 词`;
}

/* ===================== 真假词速判 ===================== */
const KIND_LABEL = { affix: "词缀错配", morph: "真词形变", combo: "非法组合" };
let probes = [], pIdx = 0, correct = 0, answered = 0, timerId = null, startedAt = 0;
let misses = [], times = [];

function sample(arr, n){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
function buildProbes(){
  const learned = CARDS.filter((c) => state(c.w));
  const pool = learned.length >= 12 ? learned : CARDS;
  const reals = sample(pool, 20).map((c) => ({ w: c.w, real: true }));
  const fakes = sample(FAKES, 10).map((f) => ({ w: f.w, real: false, kind: f.kind, base: f.base }));
  return sample([...reals, ...fakes], 30);
}
function startProbe(){
  if (pIdx >= probes.length) return finishDrill();
  const p = probes[pIdx];
  $("probe-word").textContent = p.w;
  $("verdict").textContent = "";
  $("verdict").className = "verdict";
  $("tally-pos").textContent = `第 ${pIdx + 1} / ${probes.length} 题`;
  $("btn-fake").disabled = false; $("btn-real").disabled = false;
  startedAt = performance.now();
  const bar = $("timer");
  clearTimeout(timerId);
  if (settings.limit > 0){
    bar.style.transition = "none"; bar.style.width = "100%";
    requestAnimationFrame(() => { bar.style.transition = `width ${settings.limit}ms linear`; bar.style.width = "0%"; });
    timerId = setTimeout(() => answerProbe(null), settings.limit);
  } else {
    bar.style.transition = "none"; bar.style.width = "100%";
  }
}
function answerProbe(saidReal){
  clearTimeout(timerId);
  $("btn-fake").disabled = true; $("btn-real").disabled = true;
  const p = probes[pIdx];
  times.push(saidReal === null ? (settings.limit || 0) : performance.now() - startedAt);
  const right = saidReal === p.real;
  answered++;
  if (p.real && settings.autoSpeak) tts.speak(p.w, { rate: 0.85 });   // 只读真词，假词读了等于泄题
  if (right){
    correct++;
    $("verdict").textContent = p.real ? "✓ 真词" : `✓ 假词 · ${KIND_LABEL[p.kind]}`;
    $("verdict").className = "verdict ok";
  } else {
    misses.push(p);
    $("verdict").textContent = p.real
      ? (saidReal === null ? "超时 · 这是真词" : "✗ 这是真词")
      : `✗ 假词 · ${KIND_LABEL[p.kind]}（由 ${p.base} 造出）`;
    $("verdict").className = "verdict no";
  }
  $("tally-acc").textContent = `正确率 ${Math.round((correct / answered) * 100)}%`;
  $("timer").style.transition = "none"; $("timer").style.width = "0%";
  pIdx++;
  setTimeout(startProbe, right ? 600 : 1500);
}
function finishDrill(){
  $("drill-live").hidden = true;
  $("drill-report").hidden = false;
  const acc = Math.round((correct / probes.length) * 100);
  logDay("drill", acc);
  $("r-acc").innerHTML = `${acc}%<small> 正确率</small>`;
  const avg = times.reduce((a, b) => a + b, 0) / times.length / 1000;
  $("r-time").textContent = `平均反应 ${avg.toFixed(1)} 秒 · 共 ${probes.length} 题`;
  const kinds = ["affix", "morph", "combo"];
  const counts = Object.fromEntries(kinds.map((k) => [k, misses.filter((m) => m.kind === k).length]));
  const realMiss = misses.filter((m) => m.real).length;
  const max = Math.max(1, ...Object.values(counts), realMiss);
  $("r-breakdown").innerHTML = kinds.map((k) => `
    <div class="brow"><span>${KIND_LABEL[k]}</span>
      <span class="track"><i style="width:${(counts[k]/max)*100}%"></i></span>
      <span class="n">${counts[k]}</span></div>`).join("") +
    `<div class="brow"><span>真词误判</span>
      <span class="track"><i style="width:${(realMiss/max)*100}%"></i></span>
      <span class="n">${realMiss}</span></div>`;
  $("r-misses").innerHTML = misses.length
    ? misses.map((m) => m.real
        ? `<b>${m.w}</b> — 真词，被判成了假词`
        : `<b>${m.w}</b> — 假词，${KIND_LABEL[m.kind]}，由 <b>${m.base}</b> 造出`).join("<br>")
    : "全对。";
}
function resetDrill(){
  probes = buildProbes(); pIdx = 0; correct = 0; answered = 0; misses = []; times = [];
  $("drill-report").hidden = true; $("drill-live").hidden = false;
  $("tally-acc").textContent = "正确率 —";
  startProbe();
}
$("btn-fake").addEventListener("click", () => answerProbe(false));
$("btn-real").addEventListener("click", () => answerProbe(true));
$("again-drill").addEventListener("click", resetDrill);
document.addEventListener("keydown", (e) => {
  if ($("panel-drill").hidden) return;
  if (e.key === "ArrowLeft" && !$("btn-fake").disabled) answerProbe(false);
  if (e.key === "ArrowRight" && !$("btn-real").disabled) answerProbe(true);
});

/* ===================== 查词 ===================== */
const LS_LEXICON = "wc.lexicon.v1";
const LS_DAYLOG  = "wc.daylog.v1";
let lexicon = lsGet(LS_LEXICON, {});   // { word: { data, hits:[{at, ai}] } }
let daylog  = lsGet(LS_DAYLOG, {});    // { "YYYY-MM-DD": { cards:n, drills:n, acc:n } }
const saveLexicon = () => lsSet(LS_LEXICON, lexicon);
const saveDaylog  = () => lsSet(LS_DAYLOG, daylog);
const dateKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

function logDay(field, value){
  const k = dateKey(Date.now());
  const d = daylog[k] ?? { cards: 0, drills: 0, accSum: 0, accN: 0 };
  if (field === "card") d.cards++;
  if (field === "drill"){ d.drills++; d.accSum += value; d.accN++; }
  daylog[k] = d; saveDaylog(); scheduleSync();
}

const DICT_PROMPT = `你是一个专业的英语—中文双语词典助手，服务对象是备考 Duolingo English Test 的中文母语学习者。

接收一个英语单词，输出一份词汇报告。规则：

1. w 填这个词的原形（比如输入 studies 就填 study）。
2. ipa 用国际音标，斜杠包裹，例如 /ˈstʌdi/。
3. pos 是词性缩写，例如 n. / v. / adj. / adv. / prep. / conj.，兼类就用 / 分隔。
4. core 是中文释义，用顿号分隔多个义项，写地道中文，不要机翻腔。
5. phrases 恰好 3 个常见搭配，examples 恰好 2 个例句。两者都用 {t, zh}：t 是英文，zh 是中文翻译。
6. fam 是同词族的派生词，列全，常见的和不常见的都要。每项恰好 1 个短语和 1 个例句。
   如果这个词确实没有派生词，fam 就只放它自己一项。
7. conf 是形近或义近的易混词，0 到 3 个，只填真实存在的英语词。
8. 所有内容字段只写内容，不要写「例句」「短语」「释义」这类标签词。
9. 如果输入不是一个英语单词（拼写错误、是别的语言、查无此词），返回 notFound: true，
   在 reason 里用中文说明原因，其余字段填空串和空数组。
10. notFound 为 false 时，w、ipa、pos、core、phrases、examples、fam 都必须有真实内容。`;

const PAIR = { type: "OBJECT", properties: { t: { type: "STRING" }, zh: { type: "STRING" } }, required: ["t","zh"] };
const DICT_SCHEMA = {
  type: "OBJECT",
  properties: {
    notFound: { type: "BOOLEAN" }, reason: { type: "STRING" },
    w: { type: "STRING" }, ipa: { type: "STRING" }, pos: { type: "STRING" }, core: { type: "STRING" },
    phrases: { type: "ARRAY", items: PAIR },
    examples: { type: "ARRAY", items: PAIR },
    fam: { type: "ARRAY", items: { type: "OBJECT", properties: {
      w: { type: "STRING" }, ipa: { type: "STRING" }, zh: { type: "STRING" },
      phrase: PAIR, example: PAIR }, required: ["w","ipa","zh","phrase","example"] } },
    conf: { type: "ARRAY", items: { type: "STRING" } },
  },
  required: ["notFound","w","ipa","pos","core","phrases","examples","fam","conf"],
};

// 单个模型会临时过载（503）或当天额度用尽（429）。挨个换着试，
// 每个模型内部再做一次退避重试——查词是用户在等的交互，不能一次失败就甩错误。
const DICT_MODELS = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.1-flash-lite", "gemini-3.8-flash"];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function callOnce(model, key, word){
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
    { method: "POST", headers: { "content-type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({
        contents: [{ parts: [{ text: `${DICT_PROMPT}\n\n要查的词：${word}` }] }],
        generationConfig: { responseMimeType: "application/json", responseSchema: DICT_SCHEMA, temperature: 0.3 },
      }) });
  if (!res.ok){
    const err = new Error(`HTTP ${res.status}`);
    err.status = res.status;
    err.body = (await res.text()).slice(0, 200);
    throw err;
  }
  const j = await res.json();
  const text = j?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (typeof text !== "string") throw new Error("模型返回的结构不对");
  return JSON.parse(text);
}

async function askGemini(word, onStatus = () => {}){
  const key = settings.key;
  if (!key) throw new Error("还没填 Gemini API 密钥，去「进度」页最下面填一个");

  let lastErr = null;
  for (let mi = 0; mi < DICT_MODELS.length; mi++){
    const model = DICT_MODELS[mi];
    for (let attempt = 1; attempt <= 2; attempt++){
      try {
        if (mi > 0 || attempt > 1) onStatus(`服务繁忙，换个模型再试…（${mi + 1}/${DICT_MODELS.length}）`);
        return await callOnce(model, key, word);
      } catch (err){
        lastErr = err;
        // 密钥问题换几个模型也没用，直接报错
        if (err.status === 400 || err.status === 403){
          throw new Error("密钥无效或没有权限，检查一下「进度」页里填的密钥");
        }
        // 过载：同一个模型稍等再试一次，还不行就换下一个
        if (err.status === 503 && attempt === 1){ await sleep(1200); continue; }
        break;   // 429 或其他错误：直接换下一个模型
      }
    }
  }
  if (lastErr?.status === 429) throw new Error("几个模型的今日免费额度都用完了，明天再试");
  if (lastErr?.status === 503) throw new Error("Google 那边几个模型都在忙，等几分钟再试（不是密钥的问题）");
  throw new Error(`查询失败：${lastErr?.message ?? lastErr}`);
}

// 本地词库命中：牌组里的卡片直接转成词条，不调 AI
function fromDeck(word){
  const w = word.toLowerCase();
  const c = CARDS.find((x) => x.w.toLowerCase() === w)
        || CARDS.find((x) => (x.fam || []).some((f) => f.toLowerCase() === w));
  if (!c) return null;
  return {
    notFound: false, w: c.w, ipa: c.ipa, pos: c.pos, core: c.zh,
    phrases: [], examples: [{ t: c.ex, zh: c.exZh }],
    fam: (c.fam || []).map((f) => ({ w: f, ...famInfo(f), phrase: null, example: null })),
    conf: c.conf || [], _fromDeck: true,
  };
}

// 词族成员的音标和释义：自己有卡片就用卡片的，否则查 famgloss.json
function famInfo(word){
  const w = String(word).toLowerCase();
  const c = CARDS.find((x) => x.w.toLowerCase() === w);
  if (c) return { ipa: c.ipa || "", zh: c.zh || "" };
  const g = Object.hasOwn(FAMGLOSS, w) ? FAMGLOSS[w] : null;   // constructor 这类词会撞上对象原型
  return { ipa: g?.ipa || "", zh: g?.zh || "" };
}

function recordHit(word, data, ai){
  const w = word.toLowerCase();
  const e = lexicon[w] ?? { data, hits: [] };
  e.data = data;
  e.hits.push({ at: Date.now(), ai });
  lexicon[w] = e; saveLexicon(); scheduleSync();
}

function pairHtml(p){

      ${d.phrases?.length ? `<div class="row"><div class="rowlabel">常见搭配</div>${d.phrases.map(pairHtml).join("")}</div>` : ""}
      ${d.examples?.length ? `<div class="row"><div class="rowlabel">例句</div>${d.examples.map(pairHtml).join("")}</div>` : ""}
      ${d.conf?.length ? `<div class="row"><div class="rowlabel">易混</div><div class="conf">${d.conf.map((x)=>`<span>${x}</span>`).join("")}</div></div>` : ""}
      ${d.fam?.length ? `<div class="row"><div class="rowlabel">词族</div>${
        d.fam.map((f) => ({ ...famInfo(f.w), ...Object.fromEntries(Object.entries(f).filter(([, v]) => v)) }))

      ${inDeck(d.w) ? "" : `<button class="btn" id="e-add" type="button">加入复习卡片</button>`}
    </div>`;
  const spk = $("e-spk");
  if (spk) spk.addEventListener("click", () => tts.speakPair(d.w, d.examples?.[0]?.t));
  const add = $("e-add");
  if (add) add.addEventListener("click", () => {

const LS_EXTRA = "wc.extra.v1";
// 查到的词手动加入牌组（查词页的「加入复习卡片」按钮）：已经在库里的就跳过，返回是否新加了一张
function addToDeck(d){
  if (d.notFound || !d.w) return false;
  if (CARDS.some((c) => c.w.toLowerCase() === String(d.w).toLowerCase())) return false;
  const card = {
    w: d.w, ipa: d.ipa, pos: d.pos, zh: d.core,
    fam: (d.fam || []).map((f) => f.w).filter((x) => x.toLowerCase() !== d.w.toLowerCase()).slice(0, 4),
    ex: d.examples?.[0]?.t || "", exZh: d.examples?.[0]?.zh || "",
    conf: (d.conf || []).slice(0, 3), lvl: "自查", src: "查词", c: ["其他"],
  };
  const extra = lsGet(LS_EXTRA, []);
  if (!extra.some((c) => c.w.toLowerCase() === card.w.toLowerCase())) extra.push(card);
  lsSet(LS_EXTRA, extra);
  CARDS.push(card);
  buildQueue();
  scheduleSync();
  return true;
}

async function lookup(word){
  const w = String(word).trim().toLowerCase();
  if (!w) return;
  $("dict-msg").textContent = "查询中…";
  $("dict-out").innerHTML = "";
  try {
    const cached = lexicon[w];
    if (cached){
      recordHit(w, cached.data, false);
      renderEntry(cached.data, "读自本地词库");
      $("dict-msg").textContent = "";
      return;
    }
    const deck = fromDeck(w);
    if (deck){
      recordHit(w, deck, false);
      renderEntry(deck, "读自已有卡片");
      $("dict-msg").textContent = "";
      return;
    }
    const data = await askGemini(w, (msg) => { $("dict-msg").textContent = msg; });
    recordHit(w, data, true);
    renderEntry(data, "AI 生成");
    $("dict-msg").textContent = "";
  } catch (err){
    $("dict-msg").textContent = String(err.message || err);
  }
}

function renderCalendar(){
  const byDate = {};
  for (const [w, e] of Object.entries(lexicon)){
    for (const h of e.hits){
      const k = dateKey(h.at);
      (byDate[k] ??= []).push({ w, ai: h.ai, at: h.at });
    }
  }
  const days = [...new Set([...Object.keys(byDate), ...Object.keys(daylog)])].sort().reverse();
  if (!days.length){
    $("cal-out").innerHTML = `<div class="empty" style="margin-top:12px">
      <div class="big">还没有记录</div><div>查过的词和每天的复习量会记在这里。</div></div>`;
    return;
  }
  $("cal-out").innerHTML = days.map((k) => {
    const words = (byDate[k] || []).sort((a, b) => b.at - a.at);
    const seen = new Set();
    const uniq = words.filter((x) => (seen.has(x.w) ? false : seen.add(x.w)));
    const st = daylog[k];
    const stat = st
      ? `复习 ${st.cards} 张${st.accN ? ` · 速判 ${st.drills} 轮，平均正确率 ${Math.round(st.accSum / st.accN)}%` : ""}`
      : "";
    return `<div class="cal-day">
      <div class="cal-date">${k}</div>
      ${uniq.length ? `<div class="cal-words">${uniq.map((x) =>
        `<button class="cal-w${x.ai ? " ai" : ""}" data-w="${x.w}">${x.w}</button>`).join("")}</div>` : ""}
      ${stat ? `<div class="cal-stat">${stat}</div>` : ""}
    </div>`;
  }).join("");
  for (const b of $("cal-out").querySelectorAll(".cal-w")){
    b.addEventListener("click", () => { selectTab("dict"); $("q").value = b.dataset.w; toggleClear(); lookup(b.dataset.w); });
  }
}

/* ===================== 跨设备同步 =====================
   只有一个使用者，所以不做同步码：所有设备读写同一份文档。
   代价是站点公开，文档路径在源码里可见 —— 别人理论上能读写这份进度。
   学习进度不算敏感，所以接受；但 Gemini 密钥绝不同步，那个泄露是真损失。 */
const SYNC = {
  key: "AIzaSyDqL_KE6biXwcf_5KZ1i8xj3SCuZRXWppo",
  project: "kartu-kosakata",
  doc: "english-rebecca-8a7e982b9bba",
};
const SYNC_URL = `https://firestore.googleapis.com/v1/projects/${SYNC.project}/databases/(default)/documents/progress/${SYNC.doc}?key=${SYNC.key}`;
let syncing = false, syncTimer = null;

function setSyncState(text){
  const el = $("sync-state");
  if (el) el.textContent = text;
}

// 合并：逐词取更新时间较新的一条，其余集合取并集
function mergeProgress(local, remote){
  const out = { ...remote };
  for (const [w, p] of Object.entries(local)){
    const r = out[w];
    if (!r || (p.at ?? 0) >= (r.at ?? 0)) out[w] = p;
  }
  return out;
}
function mergeDaylog(local, remote){
  const out = { ...remote };
  for (const [k, d] of Object.entries(local)){
    const r = out[k];
    out[k] = r ? {
      cards: Math.max(d.cards ?? 0, r.cards ?? 0),
      drills: Math.max(d.drills ?? 0, r.drills ?? 0),
      accSum: Math.max(d.accSum ?? 0, r.accSum ?? 0),
      accN: Math.max(d.accN ?? 0, r.accN ?? 0),
    } : d;
  }
  return out;
}
function mergeLexicon(local, remote){
  const out = { ...remote };
  for (const [w, e] of Object.entries(local)){
    const r = out[w];
    if (!r){ out[w] = e; continue; }
    const seen = new Set();
    const hits = [...(r.hits ?? []), ...(e.hits ?? [])]
      .filter((h) => (seen.has(h.at) ? false : seen.add(h.at)))
      .sort((a, b) => a.at - b.at);
    out[w] = { data: e.data ?? r.data, hits };
  }
  return out;
}
function mergeExtra(local, remote){
  const out = [...remote];
  for (const c of local) if (!out.some((x) => x.w.toLowerCase() === c.w.toLowerCase())) out.push(c);
  return out;
}

async function pullRemote({ quiet = false } = {}){
  if (!navigator.onLine) { if (!quiet) setSyncState("离线，用的是本机进度"); return false; }
  try {
    const res = await fetch(SYNC_URL, { cache: "no-store" });
    if (res.status === 404) return true;              // 还没建过，等第一次上传
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    const raw = (name) => {
      const v = j?.fields?.[name]?.stringValue;
      try { return v ? JSON.parse(v) : null; } catch { return null; }
    };
    const rp = raw("progress"), rl = raw("lexicon"), rd = raw("daylog"), re = raw("extra");
    if (rp) progress = mergeProgress(progress, rp);
    if (rl) lexicon  = mergeLexicon(lexicon, rl);
    if (rd) daylog   = mergeDaylog(daylog, rd);
    if (re){
      const merged = mergeExtra(lsGet(LS_EXTRA, []), re);
      lsSet(LS_EXTRA, merged);
      for (const c of merged) if (!CARDS.some((x) => x.w.toLowerCase() === c.w.toLowerCase())) CARDS.push(c);
    }
    saveProgress(); saveLexicon(); saveDaylog();
    return true;
  } catch (err){
    if (!quiet) setSyncState("同步失败，用的是本机进度");
    return false;
  }
}

async function pushLocal(){
  if (!navigator.onLine) return;
  const body = { fields: {
    progress: { stringValue: JSON.stringify(progress) },
    lexicon:  { stringValue: JSON.stringify(lexicon) },
    daylog:   { stringValue: JSON.stringify(daylog) },
    extra:    { stringValue: JSON.stringify(lsGet(LS_EXTRA, [])) },
    at:       { stringValue: new Date().toISOString() },
  } };
  try {
    const res = await fetch(SYNC_URL, {
      method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    setSyncState(res.ok ? `已同步 ${new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}` : "同步失败");
  } catch { setSyncState("同步失败，用的是本机进度"); }
}

// 本地一有改动就排一次上传，2 秒内的连续改动合并成一次
function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushLocal, 2000);
}

// 先拉远端合并，再把合并结果推回去，然后刷新界面
async function syncNow({ quiet = false } = {}){
  if (syncing) return;
  syncing = true;
  if (!quiet) setSyncState("同步中…");
  const ok = await pullRemote({ quiet });
  if (ok) await pushLocal();
  syncing = false;
  buildQueue(); renderCard(); updateToday();
  if (!$("panel-more").hidden) renderStats();
  if (!$("panel-cal").hidden) renderCalendar();
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow({ quiet: true }); });

setInterval(() => { if (!document.hidden) syncNow({ quiet: true }); }, 60000);

/* ===================== 下拉刷新 =====================
   页面在顶部时往下拉，松手超过阈值：先同步一次进度（最多等 3 秒，免得刚背的没传上去），
   再整页重新加载。Service Worker 是先联网，所以重新加载就拿到最新的页面和词库。 */
(() => {
  const el = $("ptr");
  const TRIGGER = 70;
  let startY = null, startX = 0, pull = 0, busy = false;
  const show = (y, text) => {
    el.style.transform = `translate(-50%, ${Math.min(y, TRIGGER + 20) - 60}px)`;
    el.style.opacity = y > 10 ? "1" : "0";
    el.textContent = text;
  };
  const reset = () => { el.classList.remove("dragging"); el.style.transform = ""; el.style.opacity = ""; };

  document.addEventListener("touchstart", (e) => {
    if (busy || e.touches.length !== 1 || window.scrollY > 0) { startY = null; return; }
    if (e.target.closest("input, select, textarea")) { startY = null; return; }
    startY = e.touches[0].clientY; startX = e.touches[0].clientX; pull = 0;
  }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    if (startY === null) return;
    const dy = e.touches[0].clientY - startY, dx = Math.abs(e.touches[0].clientX - startX);
    if (dy <= 0 || dx > dy || window.scrollY > 0) { pull = 0; reset(); return; }
    pull = dy * 0.5;   // 阻尼：手指拉 140px，提示走 70px
    el.classList.add("dragging");
    show(pull, pull >= TRIGGER ? "松手刷新" : "下拉刷新");
  }, { passive: true });

  document.addEventListener("touchend", async () => {
    if (startY === null) return;
    startY = null;
    el.classList.remove("dragging");
    if (pull < TRIGGER){ reset(); return; }
    busy = true;
    show(TRIGGER, "刷新中…");
    await Promise.race([syncNow({ quiet: true }), sleep(3000)]).catch(() => {});
    location.reload();
  });
})();

      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    } catch {}
  });
}
</script>
</body>
</html>
